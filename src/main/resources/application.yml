# ---------------------------------------------------------------
# ForumX – Module Configuration
# ---------------------------------------------------------------
forumx:
  # Redis – Upstash (Lettuce + TLS + connection pooling)
  # RedisConfig reads ONLY from forumx.redis.* via RedisProperties.
  # spring.data.redis.* is NOT used (we build LettuceConnectionFactory manually).
  redis:
    enabled: true
    host: national-liger-179032.upstash.io
    port: 6379
    password: gQAAAAAAArtYAAIgcDFjNjJiZjM4NzM1YTI0MzU1ODM5MDQ5YWZjZmJjNmMyOA
    ssl: true
    database: 0
    timeout: 5s
    cache:
      ttl: 60m
      key-prefix: "forumx:cache:"
    pool:
      max-active: 16
      max-idle: 8
      min-idle: 2
      max-wait: 2s

  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}

  messaging:
    enabled: true
    host: puffin.rmq2.cloudamqp.com
    port: 5671
    username: bjqdpchc
    password: VvSBPPtPyxwK1pBMcqVQGIFGVlaa-8f5
    virtual-host: bjqdpchc
    ssl: true
    publisher-confirm-type: correlated
    publisher-returns: true

  rabbitmq:
    exchanges:
      system: forumx.events.system
      user: forumx.events.user
      notification: forumx.events.notification
      support: forumx.events.support
      retry: forumx.retry.exchange
      dlx: forumx.dlx.exchange
    queues:
      user-notification: forumx.user.notification.queue
      email: forumx.notification.email.queue
      retry: forumx.notification.retry.queue
      dead-letter: forumx.notification.dead.queue
