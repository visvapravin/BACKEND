spring:
  application:
    name: ForumX
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:forumx}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:forumx}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:forumx}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ForumXHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
      jakarta:
        persistence:
          validation:
            mode: auto
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ${KAFKA_CONSUMER_GROUP_ID:forumx-consumer-group}
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.forumx
    producer:
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      acks: all
      properties:
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:5}
        enable.idempotence: true
    admin:
      fail-fast: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: when_authorized
  health:
    probes:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    persist-authorization: true
    display-operation-id: true
    disable-swagger-default-url: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production}
      expiration: ${JWT_EXPIRATION:24h}
  redis:
    cache:
      ttl: ${REDIS_CACHE_TTL:60m}
      key-prefix: ${REDIS_CACHE_KEY_PREFIX:forumx:cache:}
  rabbitmq:
    exchange:
      name: ${RABBITMQ_EXCHANGE:forumx.events.exchange}
    retry-exchange:
      name: ${RABBITMQ_RETRY_EXCHANGE:forumx.retry.exchange}
    dead-letter-exchange:
      name: ${RABBITMQ_DLQ_EXCHANGE:forumx.dlx.exchange}
    queues:
      notification: ${RABBITMQ_NOTIFICATION_QUEUE:forumx.notification.queue}
      email: ${RABBITMQ_EMAIL_QUEUE:forumx.email.queue}
      retry: ${RABBITMQ_RETRY_QUEUE:forumx.retry.queue}
      dead-letter: ${RABBITMQ_DLQ:forumx.dead-letter.queue}
    routing-keys:
      notification: ${RABBITMQ_NOTIFICATION_ROUTING_KEY:forumx.notification}
      email: ${RABBITMQ_EMAIL_ROUTING_KEY:forumx.email}
      retry: ${RABBITMQ_RETRY_ROUTING_KEY:forumx.retry}
      dead-letter: ${RABBITMQ_DLQ_ROUTING_KEY:forumx.dead-letter}
    retry-ttl: ${RABBITMQ_RETRY_TTL:5m}
  kafka:
    topic:
      notification: ${KAFKA_NOTIFICATION_TOPIC:forumx.notification}
      email: ${KAFKA_EMAIL_TOPIC:forumx.email}
      retry: ${KAFKA_RETRY_TOPIC:forumx.retry}
      dlq: ${KAFKA_DLQ_TOPIC:forumx.dlq}
    retry:
      attempts: ${KAFKA_RETRY_ATTEMPTS:3}
      delay-ms: ${KAFKA_RETRY_DELAY_MS:5000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:forumx-consumer-group}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.forumx: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: DEBUG
    com.forumx: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.forumx: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
