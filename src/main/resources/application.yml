# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging:
  level:
    root: INFO
    com.forumx: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    io.lettuce.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
# ---------------------------------------------------------------
# Dev Profile – local-development overrides
# ---------------------------------------------------------------
# Activate with: --spring.profiles.active=dev
#
# Disables cloud services (Redis, RabbitMQ) so the application
# can run offline without any external dependencies.
# InMemoryRedisGateway is used automatically when Redis is disabled.
# ---------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  cache:
    type: none
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

forumx:
  redis:
    enabled: false   # Use InMemoryRedisGateway; tests override via @DynamicPropertySource
  messaging:
    enabled: false

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,prometheus,beans
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: DEBUG
    com.forumx: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
