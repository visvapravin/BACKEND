    client-id: 924087041522-fqdejb0kii9a98v34ci0bslm50iesq61.apps.googleusercontent.com
  security:
    jwt:
      secret: QXOD/DAudr+HAihW+OyEhRlp47+XzvBpLrPzbNTbDhR7MqQSTxSImzckXajMAWTjsECRmHJXbyM4IGuLCgqZqQ==
      issuer: ForumX
