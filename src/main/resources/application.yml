# ---------------------------------------------------------------
# ForumX – Primary Configuration (Cloud-First)
# ---------------------------------------------------------------
# This is the single source of truth for all configuration.
# All cloud services (Neon, Upstash, CloudAMQP, Gmail) are
# configured here as production defaults.
#
# For local development without cloud services, activate the
# dev profile:  --spring.profiles.active=dev
# ---------------------------------------------------------------

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  application:
    name: ForumX

  # ---------------------------------------------------------------
  # Database – Neon PostgreSQL
  # ---------------------------------------------------------------
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ForumXHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
      jakarta:
        persistence:
          validation:
            mode: auto

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: true

  # ---------------------------------------------------------------
  # Message Broker – CloudAMQP (RabbitMQ with TLS)
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # Email – Gmail SMTP
  # ---------------------------------------------------------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: backendforumx@gmail.com
    password: mjywpgfutvcpibes
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Kafka is disabled; config kept for future use
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      group-id: ${KAFKA_CONSUMER_GROUP_ID:forumx-consumer-group}
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.forumx
    producer:
      retries: 3
      acks: all
      properties:
        linger.ms: 5
        enable.idempotence: true
    admin:
      fail-fast: true

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false

# ---------------------------------------------------------------
# Actuator – Health, Metrics
# Spring Boot auto-detects LettuceConnectionFactory and exposes
# redis health via RedisHealthContributorAutoConfiguration.
# ---------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true

# ---------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    persist-authorization: true
    display-operation-id: true
    disable-swagger-default-url: true

# ---------------------------------------------------------------
# Application – Security, Frontend, JWT
# ---------------------------------------------------------------
app:
