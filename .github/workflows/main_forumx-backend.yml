# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy JAR app to Azure Web App - forumx-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build Spring Boot executable JAR
        run: ./mvnw clean package -DskipTests

      - name: Verify generated JAR exists
        run: |
          echo "=== Contents of target/ directory ==="
          ls -lh target/
          if [ ! -f target/forumx-0.0.1-SNAPSHOT.jar ]; then
            echo "::error::Executable JAR target/forumx-0.0.1-SNAPSHOT.jar was not generated!"
            exit 1
          fi
          echo "=== Found Spring Boot executable JAR: target/forumx-0.0.1-SNAPSHOT.jar ==="

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/forumx-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Required for Azure OIDC login
      contents: read  # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: target

      - name: Verify downloaded JAR
        run: |
          echo "=== Contents of target/ in deploy runner ==="
          ls -lh target/
          if [ ! -f target/forumx-0.0.1-SNAPSHOT.jar ]; then
            echo "::error::target/forumx-0.0.1-SNAPSHOT.jar not found after download!"
            exit 1
          fi
          echo "=== Ready to deploy: target/forumx-0.0.1-SNAPSHOT.jar ==="

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F91CE33979A9445DB54C25D3687C8B68 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C943790EDF514D44AFEB8428180E6832 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0803990BEC3424B806C59CF4A96427B }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'forumx-backend'
          slot-name: 'Production'
          package: 'target/forumx-0.0.1-SNAPSHOT.jar'
